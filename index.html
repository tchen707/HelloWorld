<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060E" />
<title>Hello World — Discover what's happening.</title>
<style>
/* ============================================================
   Hello World — a portal into global music culture
   Single file. No frameworks. Vanilla everything.
   ------------------------------------------------------------
   1. Tokens
   2. Base + ambient background
   3. Landing state
   4. World state (globe chrome, title, markers, city rail)
   5. Sheet (city modal)
   6. Motion primitives + responsive + reduced motion
   ============================================================ */

/* ---------- 1. Tokens ---------- */
:root{
  --ink:        #07060E;
  --ink-2:      #100C22;
  --cream:      #F7F2E9;
  --muted:      rgba(247,242,233,.56);
  --faint:      rgba(247,242,233,.30);

  --sun:        #FFC53D;
  --coral:      #FF6B3D;
  --violet:     #8B6BFF;
  --cyan:       #39E0C8;
  --pink:       #FF5FA2;
  --sky:        #59C9FF;

  --glass:      rgba(255,255,255,.055);
  --glass-2:    rgba(255,255,255,.09);
  --stroke:     rgba(255,255,255,.11);
  --stroke-2:   rgba(255,255,255,.18);

  --r-sm: 14px;
  --r-md: 20px;
  --r-lg: 30px;

  --ease:      cubic-bezier(.22,.9,.25,1);
  --ease-out:  cubic-bezier(.16,1,.3,1);
  --spring:    cubic-bezier(.2,1.25,.4,1);

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", Inter, system-ui, sans-serif;
}

/* ---------- 2. Base ---------- */
*, *::before, *::after{ box-sizing:border-box; }

html, body{ height:100%; }

body{
  margin:0;
  font-family:var(--font);
  color:var(--cream);
  background:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}

/* deep-space wash sitting under everything */
.wash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 110%, rgba(139,107,255,.20), transparent 60%),
    radial-gradient(90% 70% at 50% -10%, rgba(57,224,200,.10), transparent 65%),
    linear-gradient(180deg, #07060E 0%, #0C0919 45%, #07060E 100%);
}

/* ambient gradient blobs — slow, soft, never distracting */
.blobs{ position:fixed; inset:-15%; z-index:0; pointer-events:none; filter:blur(90px); opacity:.55; }
.blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; }
.blob.a{ width:52vmax; height:52vmax; left:-10vmax; top:-6vmax;
  background:radial-gradient(circle at 50% 50%, rgba(255,107,61,.55), transparent 62%);
  animation:drift-a 34s var(--ease) infinite; }
.blob.b{ width:46vmax; height:46vmax; right:-12vmax; top:14vmax;
  background:radial-gradient(circle at 50% 50%, rgba(139,107,255,.55), transparent 62%);
  animation:drift-b 42s var(--ease) infinite; }
.blob.c{ width:44vmax; height:44vmax; left:22vmax; bottom:-18vmax;
  background:radial-gradient(circle at 50% 50%, rgba(57,224,200,.42), transparent 62%);
  animation:drift-c 38s var(--ease) infinite; }

@keyframes drift-a{ 0%,100%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(6vmax,4vmax,0) scale(1.12)} }
@keyframes drift-b{ 0%,100%{transform:translate3d(0,0,0) scale(1.08)} 50%{transform:translate3d(-7vmax,5vmax,0) scale(.94)} }
@keyframes drift-c{ 0%,100%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(4vmax,-6vmax,0) scale(1.15)} }

#stage{ position:fixed; inset:0; z-index:1; display:block; touch-action:none; }

/* ---------- 3. Landing ---------- */
#landing{
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:clamp(24px,6vw,64px);
  text-align:center;
  transition:opacity .8s var(--ease), transform 1.15s var(--ease), filter .8s var(--ease);
}
body.entered #landing{
  opacity:0; transform:scale(1.14) translateY(-2vh); filter:blur(14px); pointer-events:none;
}

.eyebrow{
  display:inline-flex; align-items:center; gap:.6rem;
  padding:.5rem 1rem .5rem .7rem;
  border:1px solid var(--stroke); border-radius:999px;
  background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  font-size:.78rem; letter-spacing:.04em; color:var(--muted);
  margin-bottom:clamp(22px,4vh,40px);
}
.pulse-dot{
  width:7px; height:7px; border-radius:50%; background:var(--cyan);
  box-shadow:0 0 0 0 rgba(57,224,200,.7);
  animation:live 2.4s var(--ease) infinite;
}
@keyframes live{
  0%{ box-shadow:0 0 0 0 rgba(57,224,200,.55) }
  70%{ box-shadow:0 0 0 11px rgba(57,224,200,0) }
  100%{ box-shadow:0 0 0 0 rgba(57,224,200,0) }
}

.hero{
  margin:0;
  font-size:clamp(3.4rem, 13.5vw, 9rem);
  font-weight:600;
  line-height:.92;
  letter-spacing:-.045em;
  background:linear-gradient(96deg, var(--cream) 12%, #FFE9B8 38%, var(--cream) 62%, #D9CFFF 88%);
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:shimmer 9s linear infinite;
}
@keyframes shimmer{ 0%{background-position:0% 50%} 100%{background-position:220% 50%} }

.sub{
  margin:clamp(16px,2.6vh,24px) 0 clamp(34px,5vh,52px);
  font-size:clamp(1rem,2.6vw,1.22rem);
  color:var(--muted); letter-spacing:-.01em;
}

.enter-wrap{ position:relative; display:inline-flex; }
.enter-wrap::after{ /* halo */
  content:""; position:absolute; inset:-26%;
  border-radius:999px; z-index:-1;
  background:conic-gradient(from 0deg, rgba(255,197,61,.55), rgba(255,107,61,.35), rgba(139,107,255,.45), rgba(255,197,61,.55));
  filter:blur(22px); opacity:.55;
  animation:spin 12s linear infinite;
  transition:opacity .5s var(--ease);
}
.enter-wrap:hover::after{ opacity:.95; }
@keyframes spin{ to{ transform:rotate(1turn) } }

.enter{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; gap:.85rem;
  padding:1.05rem 1.6rem 1.05rem 2rem;
  border:0; border-radius:999px; cursor:pointer;
  background:linear-gradient(180deg,#FFD469,#FFB425);
  color:#161006;
  font-family:inherit; font-size:1.02rem; font-weight:640; letter-spacing:-.01em;
  box-shadow:0 12px 34px rgba(255,180,37,.24), inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .45s var(--spring), box-shadow .45s var(--ease), filter .3s var(--ease);
}
.enter:hover{ transform:translateY(-4px) scale(1.03); box-shadow:0 22px 50px rgba(255,180,37,.34), inset 0 1px 0 rgba(255,255,255,.7); }
.enter:active{ transform:translateY(-1px) scale(.985); }
.enter:focus-visible{ outline:2px solid var(--cream); outline-offset:5px; }
.enter .arrow{
  display:grid; place-items:center; width:30px; height:30px; border-radius:50%;
  background:rgba(22,16,6,.12);
  transition:transform .5s var(--spring), background .3s var(--ease);
}
.enter:hover .arrow{ transform:translateX(5px); background:rgba(22,16,6,.2); }
.enter .ripple{
  position:absolute; border-radius:50%; transform:translate(-50%,-50%) scale(0);
  background:rgba(255,255,255,.55); pointer-events:none;
  animation:ripple .65s var(--ease-out) forwards;
}
@keyframes ripple{ to{ transform:translate(-50%,-50%) scale(3.6); opacity:0 } }

.scroll-note{
  margin-top:clamp(28px,5vh,48px);
  font-size:.76rem; letter-spacing:.13em; text-transform:uppercase; color:var(--faint);
}

/* ---------- 4. World ---------- */
#world{
  position:fixed; inset:0; z-index:10;
  opacity:0; pointer-events:none;
  transition:opacity .9s var(--ease) .18s;
}
body.entered #world{ opacity:1; }
/* the world layer stays transparent to pointers so the globe can be dragged
   anywhere; only genuinely interactive bits opt back in. */
body.entered .rail{ pointer-events:auto; }
body.entered .topbar-right{ pointer-events:auto; }

.topbar{
  position:absolute; top:0; left:0; right:0; pointer-events:none;
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; padding:clamp(16px,3vw,26px) clamp(16px,4vw,34px);
  padding-top:max(clamp(16px,3vw,26px), env(safe-area-inset-top));
}
.brand{ display:flex; align-items:center; gap:.6rem; font-size:.86rem; letter-spacing:-.01em; color:var(--muted); }
.brand .mark{
  width:18px; height:18px; border-radius:50%;
  background:conic-gradient(from 200deg, var(--sun), var(--coral), var(--violet), var(--cyan), var(--sun));
  box-shadow:0 0 16px rgba(255,197,61,.4);
  animation:spin 18s linear infinite;
}
.chip-live{
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.42rem .8rem; border-radius:999px;
  border:1px solid var(--stroke); background:var(--glass);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  font-size:.74rem; color:var(--muted); letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}

.topbar-right{ display:flex; align-items:center; gap:.7rem; }

.sound-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; flex:0 0 auto; border-radius:50%; cursor:pointer;
  border:1px solid var(--stroke); background:var(--glass); color:var(--muted);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transition:background .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
}
.sound-btn:hover{ background:var(--glass-2); border-color:var(--stroke-2); color:var(--cream); }
.sound-btn:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }
.sound-btn[aria-pressed="true"]{ color:var(--sun); border-color:color-mix(in srgb, var(--sun) 45%, var(--stroke-2)); }

.menu{ position:relative; }
.menu-btn{
  display:inline-flex; align-items:center; gap:.6rem;
  padding:.56rem .9rem .56rem 1.05rem; border-radius:999px; cursor:pointer;
  border:1px solid var(--stroke); background:var(--glass);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  color:var(--cream); font-family:inherit; font-size:.86rem; font-weight:560; letter-spacing:.01em;
  transition:background .3s var(--ease), border-color .3s var(--ease);
}
.menu-btn:hover{ background:var(--glass-2); border-color:var(--stroke-2); }
.menu-btn:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }
.menu-btn .chev{ transition:transform .35s var(--spring); flex:0 0 auto; }
.menu.open .menu-btn .chev{ transform:rotate(180deg); }

.menu-list{
  position:absolute; right:0; top:calc(100% + 12px);
  min-width:240px; max-height:min(60vh, 420px); overflow-y:auto;
  margin:0; padding:.55rem;
  list-style:none;
  border-radius:var(--r-md);
  border:1px solid var(--stroke-2);
  background:linear-gradient(165deg, rgba(28,22,52,.92), rgba(12,9,26,.94));
  backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  transform-origin:top right;
  transform:scale(.92) translateY(-6px);
  opacity:0; pointer-events:none;
  transition:opacity .28s var(--ease), transform .35s var(--spring);
}
.menu.open .menu-list{ opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }

.menu-item{
  width:100%; display:flex; align-items:center; gap:.7rem;
  padding:.78rem .9rem; border:0; border-radius:var(--r-sm); cursor:pointer;
  background:transparent; color:var(--muted);
  font-family:inherit; font-size:1rem; font-weight:540; letter-spacing:-.01em;
  text-align:left;
  transition:background .25s var(--ease), color .25s var(--ease);
}
.menu-item i{ width:8px; height:8px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); font-style:normal; flex:0 0 auto; }
.menu-item:hover, .menu-item:focus-visible{ background:var(--glass-2); color:var(--cream); outline:none; }
.menu-item.on{ color:var(--cream); background:var(--glass-2); }
.menu-item .check{ margin-left:auto; opacity:0; color:var(--sun); }
.menu-item.on .check{ opacity:1; }

/* calendar date-picker panel */
.menu-list.cal-panel{ width:290px; min-width:0; max-height:none; overflow:visible; padding:.85rem; }

.cal-head{ display:flex; align-items:center; justify-content:space-between; padding:.1rem .1rem .7rem; }
.cal-title{ font-size:.88rem; font-weight:620; color:var(--cream); letter-spacing:-.01em; }
.cal-nav{
  width:28px; height:28px; display:grid; place-items:center; border-radius:50%; cursor:pointer;
  border:1px solid var(--stroke); background:var(--glass); color:var(--cream);
  font-family:inherit; font-size:1rem; line-height:1;
  transition:background .25s var(--ease), border-color .25s var(--ease);
}
.cal-nav:hover{ background:var(--glass-2); border-color:var(--stroke-2); }

.cal-grid{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:.2rem; }
.cal-weekdays span{
  display:block; text-align:center; padding:.25rem 0;
  font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint);
}
.cal-day{
  appearance:none; -webkit-appearance:none;
  width:100%; min-width:0; margin:0; box-sizing:border-box;
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border:0; border-radius:10px; cursor:default;
  background:transparent; color:rgba(247,242,233,.22);
  font-family:inherit; font-size:.86rem; font-variant-numeric:tabular-nums;
  transition:background .25s var(--ease), color .25s var(--ease);
}
.cal-day.empty{ visibility:hidden; }
.cal-day.has-events{ color:var(--cream); font-weight:600; cursor:pointer; background:var(--glass); }
.cal-day.has-events:hover, .cal-day.has-events:focus-visible{ background:var(--glass-2); outline:none; }
.cal-day.selected{ background:var(--sun); color:#161006; }

.cal-clear{
  width:100%; margin-top:.7rem; padding:.62rem; border-radius:var(--r-sm); cursor:pointer;
  border:1px solid var(--stroke); background:transparent; color:var(--muted);
  font-family:inherit; font-size:.82rem; font-weight:520;
  transition:background .25s var(--ease), color .25s var(--ease);
}
.cal-clear:hover, .cal-clear:focus-visible{ background:var(--glass-2); color:var(--cream); outline:none; }

.title-block{
  position:absolute; left:0; right:0; top:clamp(78px,13vh,150px);
  text-align:center; pointer-events:none;
}
.world-title{
  margin:0;
  font-size:clamp(2rem,6.4vw,4.2rem);
  font-weight:600; letter-spacing:-.045em; line-height:1;
  color:var(--cream);
  text-shadow:0 0 60px rgba(139,107,255,.45), 0 0 18px rgba(255,255,255,.12);
  animation:float 7s ease-in-out infinite;
}
.world-sub{
  margin:.7rem 0 0; font-size:clamp(.78rem,2.2vw,.92rem);
  color:var(--faint); letter-spacing:.12em; text-transform:uppercase;
  animation:float 7s ease-in-out infinite .6s;
}
@keyframes float{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-11px) } }

/* markers */
#markers{ position:absolute; inset:0; pointer-events:none; }
.marker{
  position:absolute; left:0; top:0;
  display:flex; align-items:center; gap:.55rem;
  padding:0; margin:0; border:0; background:none; cursor:pointer;
  font-family:inherit; color:var(--cream);
  transform-origin:5.5px 5.5px;
  will-change:transform, opacity;
  -webkit-tap-highlight-color:transparent;
}
.marker .hit{ position:absolute; left:5.5px; top:5.5px; width:44px; height:44px; transform:translate(-50%,-50%); border-radius:50%; }
.marker .dot{
  position:relative; flex:0 0 auto;
  width:11px; height:11px; border-radius:50%;
  background:var(--c);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 22px var(--c);
  transform:scale(var(--dot-scale, 1));
  transition:transform .5s var(--spring), box-shadow .4s var(--ease);
}
.marker .dot::after{
  content:""; position:absolute; inset:-4px; border-radius:50%;
  border:1px solid var(--c); opacity:.7;
  animation:ping 3.4s var(--ease-out) infinite;
}
/* high-activity cities (15+ events) get a slow breathing glow on top of
   their (larger) base size, so cultural hubs read as visibly "alive" */
.marker.pulse .dot{ animation:pin-pulse 2.4s ease-in-out infinite; }
@keyframes pin-pulse{
  0%,100%{ box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 22px var(--c); }
  50%{ box-shadow:0 0 0 6px color-mix(in srgb, var(--c) 32%, transparent), 0 0 36px var(--c); }
}
.marker .label{
  font-size:.84rem; font-weight:520; letter-spacing:-.01em;
  padding:.3rem .68rem; border-radius:999px; white-space:nowrap;
  background:rgba(10,8,22,.5); border:1px solid var(--stroke);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:.72;
  transform:translateX(-5px);
  transition:opacity .35s var(--ease), transform .45s var(--spring), border-color .35s var(--ease), background .35s var(--ease);
}
.marker:hover .dot, .marker:focus-visible .dot{ transform:scale(calc(var(--dot-scale, 1) * 1.45)); box-shadow:0 0 0 5px color-mix(in srgb, var(--c) 26%, transparent), 0 0 34px var(--c); }
.marker:hover .label, .marker:focus-visible .label{ opacity:1; transform:translateX(0); border-color:color-mix(in srgb, var(--c) 55%, transparent); background:rgba(10,8,22,.72); }
.marker:focus-visible{ outline:none; }
.marker:active .dot{ transform:scale(calc(var(--dot-scale, 1) * 1.15)); }
@keyframes ping{
  0%{ transform:scale(.85); opacity:.75 }
  70%{ transform:scale(2.5); opacity:0 }
  100%{ transform:scale(2.5); opacity:0 }
}

/* bottom city rail */
.rail-wrap{
  position:absolute; left:0; right:0; bottom:0;
  padding:clamp(14px,3vw,26px) clamp(12px,4vw,34px);
  padding-bottom:max(clamp(14px,3vw,26px), env(safe-area-inset-bottom));
  display:flex; justify-content:center; pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.rail{
  display:flex; gap:.5rem; overflow-x:auto; max-width:100%;
  padding:.42rem; border-radius:999px;
  background:rgba(12,9,26,.5); border:1px solid var(--stroke);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{ display:none; }
.rail-btn{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:.5rem;
  padding:.6rem 1rem; border:0; border-radius:999px; cursor:pointer;
  background:transparent; color:var(--muted);
  font-family:inherit; font-size:.86rem; font-weight:520; letter-spacing:-.01em;
  transition:background .35s var(--ease), color .35s var(--ease), transform .45s var(--spring);
}
.rail-btn i{ width:7px; height:7px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); font-style:normal; }
.rail-btn:hover{ background:var(--glass-2); color:var(--cream); transform:translateY(-2px); }
.rail-btn:active{ transform:translateY(0) scale(.97); }
.rail-btn.is-active{ background:var(--glass-2); color:var(--cream); }
.rail-btn:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }

.hint{
  position:absolute; left:0; right:0; bottom:clamp(78px,12vh,104px);
  text-align:center; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint); pointer-events:none;
  transition:opacity .6s var(--ease);
}
body.touched .hint{ opacity:0; }

/* ---------- 5. Sheet ---------- */
#scrim{
  position:fixed; inset:0; z-index:40;
  background:rgba(5,4,12,.6);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; pointer-events:none;
  transition:opacity .5s var(--ease);
}
body.sheet-open #scrim{ opacity:1; pointer-events:auto; }

#sheet{
  position:fixed; z-index:50;
  left:50%; top:50%;
  width:min(560px, calc(100vw - 32px));
  max-height:min(78vh, 720px);
  display:flex; flex-direction:column;
  transform:translate(-50%,-46%) scale(.94);
  opacity:0; pointer-events:none;
  border-radius:var(--r-lg);
  border:1px solid var(--stroke-2);
  background:linear-gradient(165deg, rgba(28,22,52,.82), rgba(12,9,26,.86));
  backdrop-filter:blur(26px) saturate(140%); -webkit-backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.09);
  overflow:hidden;
  transition:opacity .45s var(--ease), transform .6s var(--spring);
}
body.sheet-open #sheet{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }

#sheet::before{ /* city-tinted bloom */
  content:""; position:absolute; left:-20%; top:-45%; width:80%; height:90%;
  background:radial-gradient(circle at 50% 50%, var(--c, var(--violet)), transparent 62%);
  opacity:.28; filter:blur(46px); pointer-events:none;
  transition:background .5s var(--ease);
}

.sheet-head{ position:relative; padding:1.6rem 1.6rem 1rem; }
.sheet-kicker{
  display:flex; align-items:center; gap:.5rem;
  font-size:.72rem; letter-spacing:.15em; text-transform:uppercase; color:var(--faint);
}
.sheet-kicker i{ width:6px; height:6px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); font-style:normal; }
.sheet-city{
  margin:.45rem 0 .1rem; font-size:clamp(2rem,7vw,2.7rem);
  font-weight:600; letter-spacing:-.045em; line-height:1;
}
.sheet-meta{ margin:0; font-size:.88rem; color:var(--muted); }

.close{
  position:absolute; top:1.25rem; right:1.25rem;
  width:38px; height:38px; display:grid; place-items:center;
  border-radius:50%; border:1px solid var(--stroke); background:var(--glass);
  color:var(--cream); cursor:pointer;
  transition:transform .45s var(--spring), background .3s var(--ease), border-color .3s var(--ease);
}
.close:hover{ transform:rotate(90deg) scale(1.08); background:var(--glass-2); border-color:var(--stroke-2); }
.close:active{ transform:rotate(90deg) scale(.95); }
.close:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:3px; }

.whats-on{
  margin:1.2rem 1.6rem .7rem; font-size:.74rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
}

.date-strip{
  display:flex; align-items:center; gap:.4rem;
  margin:0 1.6rem .9rem;
}
.date-strip-track{
  display:flex; gap:.4rem; overflow-x:auto; scroll-behavior:smooth;
  scrollbar-width:none;
}
.date-strip-track::-webkit-scrollbar{ display:none; }
.date-pill{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:50px; padding:.4rem .5rem; border-radius:12px; cursor:pointer;
  border:1px solid var(--stroke); background:var(--glass); color:var(--muted);
  font-family:inherit;
  transition:background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), transform .3s var(--spring);
}
.date-pill .dp-dow{ font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; opacity:.8; }
.date-pill .dp-num{ font-size:.92rem; font-weight:640; font-variant-numeric:tabular-nums; margin-top:.15rem; }
.date-pill:hover{ background:var(--glass-2); color:var(--cream); }
.date-pill:active{ transform:scale(.96); }
.date-pill:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }
.date-pill.selected{ background:var(--c); border-color:var(--c); color:#161006; }
.date-pill.selected .dp-dow{ opacity:.72; }
.date-strip-arrow, .date-strip-cal-btn{
  flex:0 0 auto; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; cursor:pointer;
  border:1px solid var(--stroke); background:var(--glass); color:var(--cream);
  font-family:inherit; font-size:.9rem; line-height:1;
  transition:background .25s var(--ease), border-color .25s var(--ease);
}
.date-strip-arrow:hover, .date-strip-cal-btn:hover{ background:var(--glass-2); border-color:var(--stroke-2); }
.date-strip-arrow:focus-visible, .date-strip-cal-btn:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }

.chips{
  display:flex; gap:.42rem; overflow-x:auto;
  padding:0 1.6rem .9rem; scrollbar-width:none;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; padding:.46rem .85rem; border-radius:999px; cursor:pointer;
  border:1px solid var(--stroke); background:transparent; color:var(--muted);
  font-family:inherit; font-size:.79rem; font-weight:520; white-space:nowrap;
  transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), transform .4s var(--spring);
}
.chip:hover{ color:var(--cream); border-color:var(--stroke-2); transform:translateY(-2px); }
.chip:active{ transform:translateY(0) scale(.96); }
.chip:focus-visible{ outline:2px solid var(--stroke-2); outline-offset:2px; }
.chip.on{
  color:#12100A; border-color:transparent;
  background:var(--cc, var(--cream));
}

.events{
  list-style:none; margin:0; padding:0 1.1rem 1.4rem;
  overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent;
}
.events::-webkit-scrollbar{ width:8px; }
.events::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.13); border-radius:99px; }

.event{
  display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:.9rem;
  padding:.85rem .8rem; border-radius:var(--r-sm);
  border:1px solid transparent;
  transition:background .3s var(--ease), border-color .3s var(--ease), transform .4s var(--ease);
  animation:rise .55s var(--ease-out) both;
}
.event:hover{ background:var(--glass); border-color:var(--stroke); transform:translateX(3px); }
@keyframes rise{ from{ opacity:0; transform:translateY(12px) } to{ opacity:1; transform:translateY(0) } }

.ev-time{ display:flex; flex-direction:column; gap:.2rem; }
.ev-date{ font-size:.62rem; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
.ev-hm{ font-size:.85rem; color:var(--cream); font-variant-numeric:tabular-nums; opacity:.9; }
.ev-name{ font-size:.97rem; font-weight:560; letter-spacing:-.015em; }
.ev-venue{ font-size:.79rem; color:var(--muted); margin-top:.12rem; }
.ev-cat{
  font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
  padding:.3rem .58rem; border-radius:999px; white-space:nowrap;
  color:var(--cc); background:color-mix(in srgb, var(--cc) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--cc) 30%, transparent);
}
.ev-badge{
  display:inline-block; margin-left:.45rem; font-size:.66rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--sun);
}
.ev-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:.4rem; }
.ev-tickets{
  display:inline-flex; align-items:center; gap:.35rem;
  padding:.32rem .62rem; border-radius:999px; cursor:pointer;
  border:1px solid color-mix(in srgb, var(--cc) 45%, var(--stroke));
  background:color-mix(in srgb, var(--cc) 16%, transparent);
  color:var(--cream); font-family:inherit; font-size:.7rem; font-weight:600; letter-spacing:.01em;
  text-decoration:none; white-space:nowrap;
  transition:background .25s var(--ease), border-color .25s var(--ease), transform .3s var(--spring);
}
.ev-tickets:hover, .ev-tickets:focus-visible{
  background:color-mix(in srgb, var(--cc) 32%, transparent);
  border-color:color-mix(in srgb, var(--cc) 65%, var(--stroke));
  transform:translateY(-1px); outline:none;
}
.ev-tickets:active{ transform:translateY(0) scale(.97); }
.empty{ padding:1.4rem .8rem; color:var(--muted); font-size:.9rem; }

/* ---------- 6. Responsive ---------- */
@media (max-width:760px){
  .marker .label{ opacity:0; transform:translateX(-8px); }
  .marker.near .label{ opacity:.85; transform:translateX(0); }
  .title-block{ top:clamp(70px,11vh,110px); }
  .event{ grid-template-columns:58px 1fr; }
  .ev-actions{ grid-column:2; justify-self:start; flex-direction:row; align-items:center; margin-top:.4rem; }
}
@media (max-width:520px){
  #sheet{
    left:0; top:auto; bottom:0; width:100%;
    max-height:82vh;
    border-radius:26px 26px 0 0;
    transform:translate(0,14%) scale(1);
  }
  body.sheet-open #sheet{ transform:translate(0,0) scale(1); }
  .sheet-head{ padding-top:1.9rem; }
  .sheet-head::before{
    content:""; position:absolute; top:.7rem; left:50%; transform:translateX(-50%);
    width:38px; height:4px; border-radius:99px; background:rgba(255,255,255,.2);
  }
}

@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.15s !important;
  }
}
</style>

<script>
(() => {
"use strict";

/* ============================================================
   DATA
   ============================================================ */

const CAT = {
  "DJ Sets":       "#8B6BFF",
  "Live Music":    "#FF6B3D",
  "Festivals":     "#FFC53D",
  "Underground":   "#39E0C8",
  "Art & Culture": "#FF5FA2"
};

const CITIES = [
  { name:"Berlin",   lat:52.52,  lon:13.40,   color:"#FF6B3D", tz:2,  zoneLabel:"BER", tag:"Techno capital",     apiCity:"Berlin",   apiCountry:"DE" },
  { name:"London",   lat:51.51,  lon:-0.13,   color:"#8B6BFF", tz:1,  zoneLabel:"LON", tag:"Sound system city",  apiCity:"London",   apiCountry:"GB" },
  { name:"Tokyo",    lat:35.68,  lon:139.65,  color:"#FF5FA2", tz:9,  zoneLabel:"TYO", tag:"After hours",        apiCity:"Tokyo",    apiCountry:"JP" },
  { name:"Sydney",   lat:-33.87, lon:151.21,  color:"#39E0C8", tz:10, zoneLabel:"SYD", tag:"Golden hour",        apiCity:"Sydney",   apiCountry:"AU" },
  { name:"New York", lat:40.71,  lon:-74.01,  color:"#FFC53D", tz:-4, zoneLabel:"NYC", tag:"Never closes",       apiCity:"New York", apiCountry:"US" },
  { name:"Ibiza",    lat:38.98,  lon:1.43,    color:"#59C9FF", tz:2,  zoneLabel:"IBZ", tag:"Season is open",     apiCity:"Ibiza",    apiCountry:"ES" }
];
// each city's `events` (null = not yet fetched) is populated live from
// Ticketmaster the first time its sheet is opened — see LIVE EVENT DATA below

/* ============================================================
   LIVE EVENT DATA — Ticketmaster Discovery API
   ------------------------------------------------------------
   Fetched lazily per city (once, then cached on the city object)
   the first time that city's sheet is opened. Ticketmaster's own
   genre/segment fields are mapped onto this app's existing
   category set so the chips/colors stay unchanged.
   ============================================================ */
const TICKETMASTER_API_KEY = "GIyS7jvdyOa3qNxmywtlyS7g22Q5mc7g";

function mapCategory(raw){
  const genre = raw.classifications?.[0]?.genre?.name || "";
  const segment = raw.classifications?.[0]?.segment?.name || "";
  const name = raw.name || "";
  if (/festival/i.test(name)) return "Festivals";
  if (segment === "Arts & Theatre" || segment === "Film") return "Art & Culture";
  if (genre === "Dance/Electronic") return "DJ Sets";
  if (/alternative|punk|metal|industrial/i.test(genre)) return "Underground";
  return "Live Music";
}

function normalizeEvent(raw){
  const localDate = raw.dates?.start?.localDate || null;
  const localTime = raw.dates?.start?.localTime;
  let date = null, weekday = "", dateLabel = null;
  if (localDate){
    const [y, mo, d] = localDate.split("-").map(Number);
    date = { y, m: mo - 1, d };
    const dt = new Date(y, mo - 1, d);
    weekday = dt.toLocaleDateString("en-US", { weekday:"short" });
    dateLabel = dt.toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }
  const status = raw.dates?.status?.code;
  const badge = status === "cancelled" ? "Cancelled" : status === "postponed" ? "Postponed" : undefined;

  return {
    t: localTime ? localTime.slice(0, 5) : "TBA",
    n: raw.name || "Untitled event",
    v: raw._embedded?.venues?.[0]?.name || "Venue TBA",
    c: mapCategory(raw),
    d: weekday,
    date,
    dateLabel,
    b: badge,
    url: raw.url || null
  };
}

async function fetchCityEvents(city, sizeOnly){
  const params = new URLSearchParams({
    apikey: TICKETMASTER_API_KEY,
    city: city.apiCity,
    countryCode: city.apiCountry,
    classificationName: "music",
    sort: "date,asc",
    size: sizeOnly ? "1" : "40"
  });
  const res = await fetch(`https://app.ticketmaster.com/discovery/v2/events.json?${params}`);
  if (!res.ok) throw new Error(`Ticketmaster request failed (${res.status})`);
  const data = await res.json();
  return {
    total: data.page?.totalElements ?? 0,
    events: (data._embedded?.events || []).map(normalizeEvent)
  };
}

function loadCityEvents(i){
  const city = CITIES[i];
  if (!city._promise){
    city._promise = fetchCityEvents(city, false)
      .then(({ events, total }) => {
        city.events = events;
        city.eventCount = total;
        updateMarkerScale(i);
        return events;
      })
      .catch(err => { city._promise = null; throw err; });
  }
  return city._promise;
}

/* ------------------------------------------------------------
   Pin size reflects each city's real event count — a tiered
   (non-linear) scale so one huge market doesn't dwarf everything
   else, plus a slow breathing pulse on the busiest hubs. Counts
   are fetched cheaply (size=1, just for the total) for every
   city right after Enter, well before any sheet is opened.
   ------------------------------------------------------------ */
function pinScaleForCount(n){
  if (n >= 31) return 2.1;  // extra large — capped so it never overwhelms the globe
  if (n >= 16) return 1.75; // large
  if (n >= 6)  return 1.35; // medium
  return 1;                 // small (1–5, or not yet known)
}

function updateMarkerScale(i){
  const city = CITIES[i];
  if (!city.el) return;
  const count = city.eventCount ?? 0;
  city.el.style.setProperty("--dot-scale", pinScaleForCount(count));
  city.el.classList.toggle("pulse", count >= 15);
}

function loadAllEventCounts(){
  CITIES.forEach((city, i) => {
    if (city.eventCount != null || city._promise) return; // already known or a full fetch is already underway
    fetchCityEvents(city, true)
      .then(({ total }) => { city.eventCount = total; updateMarkerScale(i); })
      .catch(() => {}); // leave the pin at its default small size on failure
  });
}

/* Coarse, stylised coastlines (lon, lat). Deliberately low-poly —
   they read as Earth at dot resolution without shipping a geo dataset. */
const LAND = [
  /* North America */[[-168,65],[-164,60],[-153,58],[-140,60],[-131,54],[-124,48],[-124,40],[-117,32],[-110,23],[-105,20],[-97,16],[-92,15],[-88,21],[-91,29],[-95,29],[-97,26],[-93,30],[-88,30],[-82,25],[-80,27],[-76,35],[-70,42],[-66,45],[-60,47],[-55,52],[-64,60],[-78,62],[-95,70],[-115,70],[-130,70],[-141,70],[-156,71]],
  /* Greenland */[[-45,60],[-30,64],[-20,70],[-22,82],[-45,83],[-58,82],[-55,70],[-50,62]],
  /* Iceland */[[-24,65],[-18,66],[-14,65],[-18,63],[-22,64]],
  /* South America */[[-81,0],[-79,-5],[-75,-14],[-71,-18],[-70,-23],[-72,-38],[-75,-45],[-74,-52],[-68,-55],[-65,-45],[-62,-40],[-57,-35],[-53,-33],[-48,-25],[-40,-20],[-35,-8],[-44,-2],[-50,0],[-52,4],[-60,8],[-68,11],[-75,9],[-78,7]],
  /* Africa */[[-17,15],[-17,21],[-10,30],[0,36],[10,37],[20,32],[32,31],[35,24],[43,12],[51,12],[48,5],[41,-2],[40,-10],[35,-20],[33,-26],[27,-34],[18,-35],[12,-18],[9,-1],[2,5],[-8,4],[-13,8]],
  /* Madagascar */[[43,-12],[50,-16],[48,-25],[44,-22],[43,-16]],
  /* Eurasia */[[-9,43],[-1,46],[2,51],[5,53],[9,54],[13,55],[19,55],[24,57],[28,60],[22,61],[21,65],[25,66],[22,70],[29,70],[33,69],[41,66],[44,68],[52,69],[60,70],[69,73],[76,72],[82,74],[92,76],[102,77],[110,76],[120,74],[132,73],[143,73],[155,71],[168,69],[178,66],[172,62],[164,60],[160,55],[156,52],[150,60],[142,54],[136,48],[131,43],[128,42],[127,38],[126,35],[122,31],[120,25],[113,22],[108,21],[106,18],[109,11],[105,9],[103,2],[100,6],[98,10],[95,16],[92,21],[89,22],[84,19],[80,13],[77,8],[73,15],[70,21],[68,24],[62,25],[57,25],[58,22],[55,17],[52,15],[45,13],[43,13],[39,21],[35,28],[34,31],[36,36],[31,37],[28,39],[26,40],[28,41],[24,41],[20,40],[16,41],[13,45],[12,45],[10,44],[6,43],[3,43]],
  /* Britain */[[-5,50],[1,51],[2,53],[-1,58],[-5,58],[-6,54]],
  /* Ireland */[[-10,52],[-6,52],[-6,55],[-10,55]],
  /* Japan */[[130,31],[133,33],[136,34],[139,35],[141,38],[144,41],[146,44],[144.5,45.5],[142,43],[139.5,39.5],[137,36.5],[134,35],[131,33.5],[128.5,32.5]],
  /* Sri Lanka */[[80,6],[82,7],[81,9],[79,9]],
  /* Sumatra */[[95,5],[100,1],[104,-3],[106,-6],[102,-5],[98,0]],
  /* Java + Bali */[[105,-6],[112,-8],[116,-8],[114,-7],[108,-6]],
  /* Borneo */[[109,2],[117,4],[119,0],[116,-4],[110,-3],[108,0]],
  /* Sulawesi + east */[[120,1],[125,1],[128,-1],[127,-4],[122,-5],[120,-2]],
  /* New Guinea */[[131,-1],[141,-3],[150,-7],[146,-9],[138,-8],[132,-4]],
  /* Philippines */[[120,18],[124,17],[126,12],[125,7],[122,6],[120,13]],
  /* Australia */[[113,-22],[114,-27],[118,-34],[126,-32],[131,-31],[137,-33],[140,-38],[146,-39],[150,-37],[153,-28],[145,-15],[142,-11],[136,-12],[130,-11],[125,-14],[122,-17],[117,-20]],
  /* Tasmania */[[145,-41],[148,-41],[148,-43],[145,-43]],
  /* New Zealand */[[172,-41],[174,-37],[178,-38],[176,-41],[171,-44],[167,-46],[170,-43]],
  /* Antarctica */[[-180,-90],[180,-90],[180,-68],[120,-66],[60,-68],[0,-70],[-60,-72],[-120,-73],[-180,-70]]
];

/* ============================================================
   SETUP
   ============================================================ */

const RAD = Math.PI / 180;
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d", { alpha:true });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;

const view = {
  rot: -0.4,        // yaw, radians
  tilt: 0.30,       // pitch, radians
  spin: 0.00022,    // idle yaw per ms
  spinTarget: 0.00022,
  vRot: 0, vTilt: 0,
  entered: 0,       // 0 → 1 entrance ease
  dim: 1,           // dims when the sheet is open
  tween: null
};

const drag = { active:false, id:null, x:0, y:0, moved:false };

/* --- land dot cloud (equal-area sampling, built once) --- */
const dots = (() => {
  const step = 1.7, pts = [];
  for (let lat = -88; lat <= 88; lat += step){
    const ring = Math.max(6, Math.round((360 / step) * Math.cos(lat * RAD)));
    for (let i = 0; i < ring; i++){
      const lon = -180 + (360 / ring) * i;
      if (!isLand(lon, lat)) continue;
      const la = lat * RAD, lo = lon * RAD;
      pts.push(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo));
    }
  }
  return new Float32Array(pts);
})();

function isLand(lon, lat){
  for (let p = 0; p < LAND.length; p++){
    const poly = LAND[p];
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

/* --- draw buckets: one fillStyle change per tier instead of per dot --- */
const TIERS = 6;
const tierFill = [];
for (let i = 0; i < TIERS; i++){
  const a = 0.07 + (i / (TIERS - 1)) * 0.72;
  const mix = i / (TIERS - 1);
  const r = Math.round(126 + mix * 84), g = Math.round(140 + mix * 88), b = Math.round(214 + mix * 41);
  tierFill.push(`rgba(${r},${g},${b},${a.toFixed(3)})`);
}
const tierX = [], tierY = [], tierS = [], tierN = new Int32Array(TIERS);
for (let i = 0; i < TIERS; i++){
  const cap = (dots.length / 3) | 0;
  tierX.push(new Float32Array(cap)); tierY.push(new Float32Array(cap)); tierS.push(new Float32Array(cap));
}

/* --- ambient particles --- */
let particles = [];
function seedParticles(){
  const n = Math.max(22, Math.min(64, Math.round((W * H) / 26000)));
  particles = Array.from({ length:n }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 0.6 + Math.random() * 1.7,
    a: 0.08 + Math.random() * 0.3,
    vy: -(0.006 + Math.random() * 0.022),
    vx: (Math.random() - 0.5) * 0.008,
    p: Math.random() * Math.PI * 2
  }));
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2;
  cy = H * (W < 640 ? 0.56 : 0.55);
  // smaller than before, leaving clear breathing room above (title) and
  // below (city rail) the globe + visualiser at typical viewport sizes
  R = Math.min(W * 0.225, H * 0.20);
  seedParticles();
}
resize();
addEventListener("resize", resize, { passive:true });

/* ============================================================
   RENDER
   ============================================================ */

let last = performance.now();
let running = true;

function frame(now){
  const dt = Math.min(48, now - last);
  last = now;

  if (running){
    update(dt);
    draw();
    placeMarkers();
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   RADIAL AUDIO VISUALIZER
   ------------------------------------------------------------
   A ring of thin bars just outside the globe, driven by a real
   AnalyserNode wherever Web Audio is available, fed by the lounge
   music generator below — genuine, continuously-evolving frequency
   data rather than fake per-frame randomness. Muted by default;
   the sound toggle only affects audibility, never the visualizer's
   reactivity.
   ============================================================ */

const VIS_BARS = 128;
const visLevels   = new Float32Array(VIS_BARS);        // smoothed 0..1, drawn each frame
const visTargets  = new Float32Array(VIS_BARS);        // latest sample, pre-smoothing
const visSmoothed = new Float32Array(VIS_BARS);        // spatially blurred copy of visLevels, for drawing
const visCeil     = new Float32Array(VIS_BARS).fill(0.05); // per-bar running peak, for AGC normalization
let visSimT = 0; // fallback animation clock when Web Audio is unavailable
let visRotation = 0; // slow continuous spin applied to the bin->angle mapping
const VIS_ROT_SPEED = (Math.PI * 2) / 24000;   // one full revolution every 24s
const VIS_ROT_SPEED_REDUCED = (Math.PI * 2) / 140000;

const visColors = (() => {
  // mirrors the brand mark's conic-gradient: sun -> coral -> violet -> cyan -> sun
  const stops = [[255,197,61],[255,107,61],[139,107,255],[57,224,200],[255,197,61]];
  const out = [];
  for (let i = 0; i < VIS_BARS; i++){
    const t = (i / VIS_BARS) * (stops.length - 1);
    const i0 = Math.floor(t), i1 = Math.min(stops.length - 1, i0 + 1), f = t - i0;
    const a = stops[i0], b = stops[i1];
    out.push([
      Math.round(a[0] + (b[0] - a[0]) * f),
      Math.round(a[1] + (b[1] - a[1]) * f),
      Math.round(a[2] + (b[2] - a[2]) * f)
    ]);
  }
  return out;
})();

let audioCtx = null, analyser = null, freqData = null, masterGain = null, soundOn = false;
let musicBus = null, noiseBuffer = null;
let musicStep = 0, musicNextTime = 0, musicTimer = null;

/* ------------------------------------------------------------
   Lounge/elevator-music generator — a laid-back ii-V-I-vi loop
   (Dm7 - G7 - Cmaj7 - Am7) comped on a soft electric piano, with
   a funky syncopated bass and a light bossa-flavoured kit. Fully
   synthesized so there's no audio file to ship or stream.
   ------------------------------------------------------------ */
const MUSIC_BPM = 96;
const MUSIC_STEP_DUR = 60 / MUSIC_BPM / 4;   // one 16th note
const MUSIC_STEPS_PER_BAR = 16;
const fifthAbove = f => f * Math.pow(2, 7 / 12);
const MUSIC_CHORDS = [
  { tones:[146.83, 174.61, 220.00, 261.63], root: 73.42  }, // Dm7  — D3 F3 A3 C4 / D2 root
  { tones:[196.00, 246.94, 293.66, 349.23, 440.00], root: 98.00 }, // G9   — G3 B3 D4 F4 A4 / G2 root
  { tones:[261.63, 329.63, 392.00, 493.88], root: 65.41  }, // Cmaj7 — C4 E4 G4 B4 / C2 root
  { tones:[220.00, 261.63, 329.63, 392.00], root: 110.00 }  // Am7  — A3 C4 E4 G4 / A2 root
];

function playEPiano(freqs, time, dur, vel){
  freqs.forEach(f => {
    const o1 = audioCtx.createOscillator();
    o1.type = "sine"; o1.frequency.setValueAtTime(f, time);
    const o2 = audioCtx.createOscillator();
    o2.type = "sine"; o2.frequency.setValueAtTime(f * 2.01, time); // bright bell-like partial, slightly detuned
    const g2 = audioCtx.createGain();
    g2.gain.value = 0.16;
    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0, time);
    env.gain.linearRampToValueAtTime(vel, time + 0.015);
    env.gain.exponentialRampToValueAtTime(Math.max(0.0001, vel * 0.3), time + dur * 0.5);
    env.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    const filt = audioCtx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 2400; filt.Q.value = 0.3;
    o1.connect(env);
    o2.connect(g2).connect(env);
    env.connect(filt).connect(musicBus);
    o1.start(time); o2.start(time);
    o1.stop(time + dur + 0.05); o2.stop(time + dur + 0.05);
  });
}

function playBass(freq, time, dur, vel){
  const osc = audioCtx.createOscillator();
  osc.type = "triangle"; osc.frequency.setValueAtTime(freq, time);
  const filt = audioCtx.createBiquadFilter();
  filt.type = "lowpass"; filt.frequency.value = 950; filt.Q.value = 1.1;
  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0, time);
  env.gain.linearRampToValueAtTime(vel, time + 0.008);
  env.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(filt).connect(env).connect(musicBus);
  osc.start(time); osc.stop(time + dur + 0.02);
}

function playKick(time, vel){
  const osc = audioCtx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(115, time);
  osc.frequency.exponentialRampToValueAtTime(42, time + 0.13);
  const env = audioCtx.createGain();
  env.gain.setValueAtTime(vel, time);
  env.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
  osc.connect(env).connect(musicBus);
  osc.start(time); osc.stop(time + 0.2);
}

function playNoiseHit(time, vel, type, freq, q, decay){
  const src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer;
  const filt = audioCtx.createBiquadFilter();
  filt.type = type; filt.frequency.value = freq; filt.Q.value = q;
  const env = audioCtx.createGain();
  env.gain.setValueAtTime(vel, time);
  env.gain.exponentialRampToValueAtTime(0.0001, time + decay);
  src.connect(filt).connect(env).connect(musicBus);
  src.start(time); src.stop(time + decay + 0.02);
}
const playRim = (time, vel) => playNoiseHit(time, vel, "bandpass", 1900, 1.5, 0.07);
const playHat = (time, vel) => playNoiseHit(time, vel, "highpass", 6500, 0.9, 0.035);

function scheduleMusicStep(step, time){
  const bar = Math.floor(step / MUSIC_STEPS_PER_BAR) % MUSIC_CHORDS.length;
  const s = step % MUSIC_STEPS_PER_BAR;
  const chord = MUSIC_CHORDS[bar];

  // soft electric-piano comping — sparse, laid-back "chunk ... chk"
  if (s === 0)  playEPiano(chord.tones, time, 1.5, 0.4);
  if (s === 10) playEPiano(chord.tones, time, 0.5, 0.24);

  // funky, syncopated bassline
  if (s === 0)  playBass(chord.root, time, 0.5, 0.55);
  if (s === 6)  playBass(fifthAbove(chord.root), time, 0.4, 0.4);
  if (s === 9)  playBass(chord.root * 2, time, 0.35, 0.42);
  if (s === 14) playBass(fifthAbove(chord.root), time, 0.35, 0.32);

  // light bossa-flavoured kit
  if (s === 0 || s === 8 || s === 10) playKick(time, s === 0 ? 0.5 : 0.34);
  if (s === 4 || s === 12) playRim(time, 0.3);
  playHat(time, s % 4 === 0 ? 0.12 : 0.07);
}

function musicScheduler(){
  while (musicNextTime < audioCtx.currentTime + 0.12){
    scheduleMusicStep(musicStep, musicNextTime);
    musicNextTime += MUSIC_STEP_DUR;
    musicStep++;
  }
}

function initAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try{
    audioCtx = new AC();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = VIS_BARS * 2;
    analyser.smoothingTimeConstant = 0.6;
    freqData = new Uint8Array(analyser.frequencyBinCount);

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0; // silent until the listener opts in via the sound toggle
    analyser.connect(masterGain).connect(audioCtx.destination);

    musicBus = audioCtx.createGain();
    musicBus.gain.value = 0.8;
    musicBus.connect(analyser);

    const nb = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    noiseBuffer = nb;

    musicStep = 0;
    musicNextTime = audioCtx.currentTime + 0.05;
    musicTimer = setInterval(musicScheduler, 25);
  } catch(err){
    audioCtx = null; analyser = null; freqData = null;
  }
}

function updateVisualizer(dt){
  // continuously rotate the bin->angle mapping. The music's kick/bass/comp
  // all land on the same beat every bar, so without this the loudest
  // moment always lit up the same bins — and since bin 0 always sat at
  // the top of the ring, that read as one fixed hot spot. Spinning the
  // mapping slowly decouples "which angle" from "which beat", so the
  // same recurring hit lands at a different point on the ring each time,
  // and the energy appears to travel continuously around the circle.
  visRotation += dt * (reduced ? VIS_ROT_SPEED_REDUCED : VIS_ROT_SPEED);
  if (visRotation > Math.PI * 2) visRotation -= Math.PI * 2;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    // Raw frequency-bin energy is heavily biased toward the low end (bass
    // is naturally far louder than treble), and since bin 0 always lands
    // at the same point on the ring, that bias reads as one permanently
    // taller region rather than organic motion. Per-bar AGC — normalizing
    // each bin against its own recent peak — removes that fixed bias so
    // every bar sits on the same footing and only real activity moves it.
    for (let i = 0; i < VIS_BARS; i++){
      const raw = freqData[i] / 255;
      if (raw > visCeil[i]) visCeil[i] = raw;
      else visCeil[i] += (raw - visCeil[i]) * 0.01;
      visCeil[i] = Math.max(visCeil[i], 0.05);
      visTargets[i] = Math.min(1, raw / visCeil[i]);
    }
  } else {
    // no Web Audio available — a smooth simulated spectrum keeps the ring alive
    visSimT += dt * 0.001;
    for (let i = 0; i < VIS_BARS; i++){
      const a = Math.sin(visSimT * 1.3 + i * 0.19);
      const b = Math.sin(visSimT * 0.7 - i * 0.11);
      let v = 0.32 + 0.3 * a + 0.2 * b;
      visTargets[i] = Math.max(0, Math.min(1, v));
    }
  }
  const smooth = reduced ? 0.35 : 0.09;
  for (let i = 0; i < VIS_BARS; i++) visLevels[i] += (visTargets[i] - visLevels[i]) * smooth;

  // spatial blur across neighboring bars (wrapping around the full circle,
  // including the seam at the top) so the ring eases from bar to bar
  // instead of stepping between independent values
  const n = VIS_BARS;
  for (let i = 0; i < n; i++){
    const a = visLevels[(i - 2 + n) % n];
    const b = visLevels[(i - 1 + n) % n];
    const c = visLevels[i];
    const d = visLevels[(i + 1) % n];
    const e = visLevels[(i + 2 + n) % n];
    visSmoothed[i] = (a + b * 2 + c * 3 + d * 2 + e) / 9;
  }
}

function drawVisualizer(r, alpha){
  const gap = r * 0.05 + 8;
  const inner = r + gap;
  const maxLen = r * (reduced ? 0.09 : 0.15);
  const minLen = 2;
  const n = VIS_BARS;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(0.8, r * 0.0035);

  for (let i = 0; i < n; i++){
    // a gentle gamma curve keeps quiet/idle bars sitting close to the
    // same resting length (a clean, uniform ring) and only lets real
    // peaks in the (already per-bar normalized) audio extend further
    const level = Math.pow(visSmoothed[i], 1.7);
    const len = minLen + level * maxLen;
    const ang = (i / n) * Math.PI * 2 - Math.PI / 2 + visRotation;
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    const x0 = cx + cosA * inner, y0 = cy + sinA * inner;
    const x1 = cx + cosA * (inner + len), y1 = cy + sinA * (inner + len);
    const c = visColors[i];
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(alpha * (0.14 + level * 0.28)).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  ctx.restore();
}

function update(dt){
  updateVisualizer(dt);
  // entrance ease
  if (entered && view.entered < 1) view.entered = Math.min(1, view.entered + dt / 1100);

  // camera tween (fly to a city)
  if (view.tween){
    const tw = view.tween;
    tw.t = Math.min(1, tw.t + dt / tw.dur);
    const e = 1 - Math.pow(1 - tw.t, 4);
    view.rot  = tw.r0 + (tw.r1 - tw.r0) * e;
    view.tilt = tw.p0 + (tw.p1 - tw.p0) * e;
    if (tw.t >= 1){ const done = tw.done; view.tween = null; if (done) done(); }
  } else if (drag.active){
    view.rot  += view.vRot;
    view.tilt += view.vTilt;
  } else {
    // inertia, then idle spin
    if (Math.abs(view.vRot) > 1e-5 || Math.abs(view.vTilt) > 1e-5){
      view.rot += view.vRot; view.tilt += view.vTilt;
      view.vRot *= 0.94; view.vTilt *= 0.9;
    }
    view.spin += (view.spinTarget - view.spin) * 0.06;
    if (!reduced) view.rot += view.spin * dt;
  }
  view.tilt = Math.max(-0.62, Math.min(0.62, view.tilt));
  view.dim += (sheetOpen ? 0.42 - view.dim : 1 - view.dim) * 0.09;
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  /* particles */
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles){
    if (!reduced){
      p.y += p.vy * 16; p.x += p.vx * 16; p.p += 0.01;
      if (p.y < -10){ p.y = H + 10; p.x = Math.random() * W; }
    }
    const tw = 0.6 + 0.4 * Math.sin(p.p);
    ctx.fillStyle = `rgba(214,206,255,${(p.a * tw * view.dim).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  if (view.entered <= 0.001) return;

  const t = view.entered;
  const ease = 1 - Math.pow(1 - t, 3);
  const r = R * (0.84 + 0.16 * ease);
  const alpha = ease * view.dim;

  ctx.save();
  ctx.globalAlpha = alpha;

  /* atmosphere */
  ctx.globalCompositeOperation = "lighter";
  const glow = ctx.createRadialGradient(cx, cy, r * 0.86, cx, cy, r * 1.42);
  glow.addColorStop(0, "rgba(120,96,255,.30)");
  glow.addColorStop(0.45, "rgba(88,120,255,.11)");
  glow.addColorStop(1, "rgba(88,120,255,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.42, 0, 6.2832); ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* ocean body */
  const sea = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.36, r * 0.08, cx, cy, r);
  sea.addColorStop(0, "#221C4A");
  sea.addColorStop(0.55, "#141033");
  sea.addColorStop(1, "#080615");
  ctx.fillStyle = sea;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();

  /* land */
  const cr = Math.cos(view.rot), sr = Math.sin(view.rot);
  const cp = Math.cos(view.tilt), sp = Math.sin(view.tilt);
  const lx = -0.42, ly = 0.40, lz = 0.81;   // light direction, view space
  tierN.fill(0);

  for (let i = 0; i < dots.length; i += 3){
    const vx = dots[i], vy = dots[i + 1], vz = dots[i + 2];
    // yaw
    const x1 = vx * cr + vz * sr;
    const z1 = -vx * sr + vz * cr;
    // pitch
    const y2 = vy * cp - z1 * sp;
    const z2 = vy * sp + z1 * cp;
    if (z2 < 0.015) continue;

    const lit = Math.max(0, x1 * lx + y2 * ly + z2 * lz);
    const v = (0.2 + 0.8 * lit) * (0.34 + 0.66 * z2);
    let tier = (v * TIERS) | 0;
    if (tier > TIERS - 1) tier = TIERS - 1;

    const n = tierN[tier]++;
    tierX[tier][n] = cx + x1 * r;
    tierY[tier][n] = cy - y2 * r;
    tierS[tier][n] = 0.9 + 1.25 * z2;
  }

  for (let k = 0; k < TIERS; k++){
    const n = tierN[k]; if (!n) continue;
    ctx.fillStyle = tierFill[k];
    const xs = tierX[k], ys = tierY[k], ss = tierS[k];
    for (let i = 0; i < n; i++) ctx.fillRect(xs[i], ys[i], ss[i], ss[i]);
  }

  /* rim light */
  ctx.strokeStyle = "rgba(160,150,255,.22)";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.stroke();

  ctx.globalCompositeOperation = "lighter";
  const rim = ctx.createRadialGradient(cx, cy, r * 0.92, cx, cy, r * 1.02);
  rim.addColorStop(0, "rgba(90,200,255,0)");
  rim.addColorStop(1, "rgba(120,180,255,.20)");
  ctx.fillStyle = rim;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.02, 0, 6.2832); ctx.fill();

  drawVisualizer(r, alpha);

  ctx.restore();
  ctx.globalCompositeOperation = "source-over";
}

/* project a lat/lon onto the screen; z > 0 means front-facing */
function project(lat, lon){
  const la = lat * RAD, lo = lon * RAD;
  const vx = Math.cos(la) * Math.sin(lo), vy = Math.sin(la), vz = Math.cos(la) * Math.cos(lo);
  const cr = Math.cos(view.rot), sr = Math.sin(view.rot);
  const cp = Math.cos(view.tilt), sp = Math.sin(view.tilt);
  const x1 = vx * cr + vz * sr;
  const z1 = -vx * sr + vz * cr;
  const y2 = vy * cp - z1 * sp;
  const z2 = vy * sp + z1 * cp;
  const rr = R * (0.84 + 0.16 * (1 - Math.pow(1 - view.entered, 3)));
  return { x: cx + x1 * rr, y: cy - y2 * rr, z: z2 };
}

const markersEl = document.getElementById("markers");
const railEl = document.getElementById("rail");

CITIES.forEach((city, i) => {

  b.addEventListener("pointerleave", () => { view.spinTarget = reduced ? 0 : 0.00022; });
  b.addEventListener("focus", () => { view.spinTarget = 0; });
  b.addEventListener("blur", () => { view.spinTarget = reduced ? 0 : 0.00022; });
  markersEl.appendChild(b);
  city.el = b;

  const r = document.createElement("button");

  r.addEventListener("click", () => flyTo(i, () => openCity(i, false)));
  railEl.appendChild(r);
  city.rail = r;
});

/* ---- topbar dropdown menus (Cities, Date) ---- */
const menus = [];
function registerMenu(elId, btnId){
  const el = document.getElementById(elId);
  const btn = document.getElementById(btnId);
  const entry = {
    el, btn,
    open(){ menus.forEach(m => { if (m !== entry) m.close(); }); el.classList.add("open"); btn.setAttribute("aria-expanded", "true"); },
    close(){ el.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); }
  };
  btn.addEventListener("click", e => {
    e.stopPropagation();
    el.classList.contains("open") ? entry.close() : entry.open();
  });
  menus.push(entry);
  return entry;
}
document.addEventListener("click", e => {
  menus.forEach(m => { if (!m.el.contains(e.target)) m.close(); });
});
addEventListener("keydown", e => {
  if (e.key === "Escape") menus.forEach(m => m.close());
});

/* cities menu */
const cityMenuEntry = registerMenu("cityMenu", "cityMenuBtn");
const cityMenuList  = document.getElementById("cityMenuList");
CITIES.forEach((city, i) => {
  const li = document.createElement("li");
  const b = document.createElement("button");
  b.className = "menu-item";
  b.setAttribute("role", "menuitem");
  b.style.setProperty("--c", city.color);
  b.innerHTML = `<i></i>${city.name}`;
  b.addEventListener("click", () => {
    cityMenuEntry.close();
    flyTo(i, () => openCity(i, false));
  });
  li.appendChild(b);
  cityMenuList.appendChild(li);
});

/* date menu — calendar picker */
const dateMenuEntry = registerMenu("dateMenu", "dateMenuBtn");
const dateMenuList  = document.getElementById("dateMenuList");
const dateMenuLabel = document.getElementById("dateMenuLabel");

const MONTH_NAMES  = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let selectedDate = null;    // { y, m, d } of the clicked date, or null for "any day"
const calView = new Date(); // month currently on screen
calView.setDate(1);

dateMenuList.innerHTML =
  `<div class="cal-head">
     <button class="cal-nav" id="calPrev" type="button" aria-label="Previous month">‹</button>
     <span class="cal-title" id="calTitle"></span>
     <button class="cal-nav" id="calNext" type="button" aria-label="Next month">›</button>
   </div>
   <div class="cal-grid cal-weekdays" aria-hidden="true">
     <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
   </div>
   <div class="cal-grid" id="calDays" role="grid"></div>
   <button class="cal-clear" id="calClear" type="button">Any day</button>`;

const calTitle = document.getElementById("calTitle");
const calDays  = document.getElementById("calDays");

function renderCalendar(){
  const y = calView.getFullYear(), m = calView.getMonth();
  calTitle.textContent = `${MONTH_NAMES[m]} ${y}`;
  calDays.innerHTML = "";

  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  for (let i = 0; i < firstDow; i++){
    const span = document.createElement("span");
    span.className = "cal-day empty";
    calDays.appendChild(span);
  }
  for (let d = 1; d <= daysInMonth; d++){
    // real events can land on any day of the week, so every date is
    // selectable — "has-events" here just means "a real calendar day"
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cal-day has-events";
    btn.textContent = d;
    btn.setAttribute("aria-label", `${MONTH_NAMES[m]} ${d}`);
    if (selectedDate && selectedDate.y === y && selectedDate.m === m && selectedDate.d === d){
      btn.classList.add("selected");
      btn.setAttribute("aria-pressed", "true");
    }
    btn.addEventListener("click", () => selectDate(y, m, d));
    calDays.appendChild(btn);
  }
}

function selectDate(y, m, d){
  selectedDate = { y, m, d };
  dateMenuLabel.textContent = `${MONTH_NAMES[m].slice(0, 3)} ${d}`;
  renderCalendar();
  dateMenuEntry.close();
  if (sheetOpen){ renderEvents(); renderDateStrip(); }
}

document.getElementById("calPrev").addEventListener("click", () => {
  calView.setMonth(calView.getMonth() - 1);
  renderCalendar();
});
document.getElementById("calNext").addEventListener("click", () => {
  calView.setMonth(calView.getMonth() + 1);
  renderCalendar();
});
document.getElementById("calClear").addEventListener("click", () => {
  selectedDate = null;
  dateMenuLabel.textContent = "Any day";
  renderCalendar();
  dateMenuEntry.close();
  if (sheetOpen){ renderEvents(); renderDateStrip(); }
});

renderCalendar();

function placeMarkers(){
  if (view.entered <= 0.02) return;
  for (const c of CITIES){
    const p = project(c.lat, c.lon);
    const front = p.z > 0;
    const fade = Math.max(0, Math.min(1, (p.z - 0.02) / 0.28));
    const s = 0.72 + 0.28 * Math.max(0, p.z);
    const el = c.el;
    el.style.transform = `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, 0) translate(-5.5px, -5.5px) scale(${s.toFixed(3)})`;
    el.style.opacity = (fade * view.entered * view.dim).toFixed(3);
    el.style.pointerEvents = (front && fade > 0.5 && !sheetOpen) ? "auto" : "none";
    el.classList.toggle("near", p.z > 0.72);
  }
}

/* rotate the globe so a city faces the viewer */
function flyTo(i, done){
  const c = CITIES[i];
  let target = -c.lon * RAD;
  const twoPi = Math.PI * 2;
  let delta = ((target - view.rot) % twoPi + twoPi * 1.5) % twoPi - Math.PI;
  view.vRot = view.vTilt = 0;
  view.tween = {
    t: 0, dur: reduced ? 1 : 1150,
    r0: view.rot, r1: view.rot + delta,
    p0: view.tilt, p1: Math.max(-0.5, Math.min(0.5, c.lat * RAD * 0.55)),
    done
  };
}

/* ============================================================
   SHEET
   ============================================================ */

const sheet   = document.getElementById("sheet");
const scrim   = document.getElementById("scrim");
const chipsEl = document.getElementById("chips");
const eventsEl= document.getElementById("events");
const sheetCity = document.getElementById("sheetCity");
const sheetMeta = document.getElementById("sheetMeta");
const sheetTag  = document.getElementById("sheetTag");
const closeBtn  = document.getElementById("closeBtn");

const dateStripTrack  = document.getElementById("dateStripTrack");
const dateStripPrev   = document.getElementById("dateStripPrev");
const dateStripNext   = document.getElementById("dateStripNext");
const dateStripCalBtn = document.getElementById("dateStripCalBtn");
const DATE_STRIP_DAYS = 60;

function renderDateStrip(){
  dateStripTrack.innerHTML = "";
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let selectedEl = null;

  for (let i = 0; i < DATE_STRIP_DAYS; i++){
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    const isToday = i === 0;

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "date-pill";
    btn.innerHTML =
      `<span class="dp-dow">${isToday ? "Today" : d.toLocaleDateString("en-US", { weekday:"short" })}</span>` +
      `<span class="dp-num">${day}</span>`;
    btn.setAttribute("aria-label", d.toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric" }));
    if (selectedDate && selectedDate.y === y && selectedDate.m === m && selectedDate.d === day){
      btn.classList.add("selected");
      btn.setAttribute("aria-pressed", "true");
      selectedEl = btn;
    }
    btn.addEventListener("click", () => selectDate(y, m, day));
    dateStripTrack.appendChild(btn);
  }
  if (selectedEl) selectedEl.scrollIntoView({ inline:"center", block:"nearest" });
}

dateStripPrev.addEventListener("click", () => dateStripTrack.scrollBy({ left:-160, behavior:"smooth" }));
dateStripNext.addEventListener("click", () => dateStripTrack.scrollBy({ left:160, behavior:"smooth" }));
dateStripCalBtn.addEventListener("click", () => dateMenuEntry.open());

let sheetOpen = false, activeCity = -1, filter = "All", lastFocus = null;

function openCity(i, fly){
  if (fly && !sheetOpen){ view.spinTarget = 0; flyTo(i, () => showSheet(i)); return; }
  showSheet(i);
}

function showSheet(i){
  const c = CITIES[i];
  activeCity = i; filter = "All";
  lastFocus = document.activeElement;
  clockCity = c;
  tick();

  // default to today rather than "any day" — otherwise the list mixes
  // events from many different upcoming dates with none of the date
  // pills highlighted, which reads as random/wrong-day events showing up
  if (!selectedDate){
    const t = new Date();
    selectedDate = { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
    dateMenuLabel.textContent = "Today";
    renderCalendar();
  }

  sheet.style.setProperty("--c", c.color);
  sheetCity.textContent = c.name;
  sheetTag.textContent = c.tag;
  renderDateStrip();

  if (c.events){
    sheetMeta.textContent = `${c.eventCount ?? c.events.length} events · via Ticketmaster`;
    buildChipsAndRender(c);
  } else {
    sheetMeta.textContent = "Loading live listings…";
    chipsEl.innerHTML = "";
    eventsEl.innerHTML = `<li class="empty">Loading tonight's lineup…</li>`;
    loadCityEvents(i).then(() => {
      if (activeCity !== i) return; // sheet moved on to a different city already
      sheetMeta.textContent = `${c.eventCount ?? c.events.length} events · via Ticketmaster`;
      buildChipsAndRender(c);
    }).catch(err => {
      console.error("Ticketmaster fetch failed:", err);
      if (activeCity !== i) return;
      sheetMeta.textContent = "Couldn't load live listings";
      eventsEl.innerHTML = `<li class="empty">Couldn't reach the events service right now. Try again shortly.</li>`;
    });
  }

  sheetOpen = true;
  document.body.classList.add("sheet-open");
  CITIES.forEach((x, n) => x.rail.classList.toggle("is-active", n === i));
  view.spinTarget = 0;
  setTimeout(() => closeBtn.focus({ preventScroll:true }), 120);
}

function buildChipsAndRender(c){
  const cats = ["All", ...new Set(c.events.map(e => e.c))];
  chipsEl.innerHTML = "";
  cats.forEach(cat => {
    const b = document.createElement("button");
    b.className = "chip" + (cat === "All" ? " on" : "");
    b.textContent = cat;
    b.style.setProperty("--cc", cat === "All" ? c.color : CAT[cat]);
    b.addEventListener("click", () => {
      filter = cat;
      [...chipsEl.children].forEach(x => x.classList.toggle("on", x === b));
      renderEvents();
    });
    chipsEl.appendChild(b);
  });
  renderEvents();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
}

function renderEvents(){
  const c = CITIES[activeCity];
  const events = c.events || [];
  const list = events.filter(e => {
    if (filter !== "All" && e.c !== filter) return false;
    if (selectedDate){
      if (!e.date) return false;
      return e.date.y === selectedDate.y && e.date.m === selectedDate.m && e.date.d === selectedDate.d;
    }
    return true;
  });
  eventsEl.innerHTML = "";
  if (!list.length){
    eventsEl.innerHTML = `<li class="empty">Nothing listed here ${selectedDate ? "for " + dateMenuLabel.textContent : "right now"}.</li>`;
    return;
  }
  list.forEach((e, i) => {
    const li = document.createElement("li");
    li.className = "event";
    li.style.setProperty("--cc", CAT[e.c]);
    li.style.animationDelay = (i * 55) + "ms";
    const safeUrl = e.url && /^https:\/\//i.test(e.url) ? e.url : null;
    const ticketsHtml = safeUrl
      ? `<a class="ev-tickets" href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">
           <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1.5 5.5v-2A1 1 0 0 1 2.5 2.5h9a1 1 0 0 1 1 1v2a1.4 1.4 0 0 0 0 2.8v2A1 1 0 0 1 11.5 11.5h-9a1 1 0 0 1-1-1v-2a1.4 1.4 0 0 0 0-2.8Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M5.5 2.5v9" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.4 1.4" stroke-linecap="round"/></svg>
           Get tickets
         </a>`
      : "";
    li.innerHTML =
      `<span class="ev-time">${e.dateLabel ? `<span class="ev-date">${escapeHtml(e.dateLabel)}</span>` : ""}<span class="ev-hm">${escapeHtml(e.t)}</span></span>` +
      `<span><span class="ev-name">${escapeHtml(e.n)}</span>${e.b ? `<span class="ev-badge">${escapeHtml(e.b)}</span>` : ""}` +
      `<span class="ev-venue">${escapeHtml(e.v)}</span></span>` +
      `<span class="ev-actions"><span class="ev-cat">${escapeHtml(e.c)}</span>${ticketsHtml}</span>`;
    eventsEl.appendChild(li);
  });
}

function closeSheet(){
  if (!sheetOpen) return;
  sheetOpen = false;
  document.body.classList.remove("sheet-open");
  CITIES.forEach(x => x.rail.classList.remove("is-active"));
  view.spinTarget = reduced ? 0 : 0.00022;
  clockCity = null;
  tick();
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true });
}

closeBtn.addEventListener("click", closeSheet);
scrim.addEventListener("click", closeSheet);
addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Tab" && sheetOpen){
    const f = sheet.querySelectorAll("button");
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   DRAG TO SPIN
   ============================================================ */

canvas.addEventListener("pointerdown", e => {
  if (!entered || sheetOpen) return;
  drag.active = true; drag.id = e.pointerId; drag.moved = false;
  drag.x = e.clientX; drag.y = e.clientY;
  view.tween = null; view.vRot = view.vTilt = 0;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = "grabbing";
});
canvas.addEventListener("pointermove", e => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 3){ drag.moved = true; document.body.classList.add("touched"); }
  view.vRot  = dx * 0.0045;
  view.vTilt = dy * 0.0030;
});
function endDrag(e){
  if (!drag.active || (e && e.pointerId !== drag.id)) return;
  drag.active = false;
  canvas.style.cursor = "grab";
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("lostpointercapture", endDrag);

/* ============================================================
   ENTER + LIFECYCLE
   ============================================================ */

let entered = false;
const enterBtn = document.getElementById("enterBtn");
const world = document.getElementById("world");

enterBtn.addEventListener("pointerdown", e => {
  const r = enterBtn.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "ripple";
  s.style.width = s.style.height = r.width + "px";
  s.style.left = (e.clientX - r.left) + "px";
  s.style.top = (e.clientY - r.top) + "px";
  enterBtn.appendChild(s);
  setTimeout(() => s.remove(), 700);
});

enterBtn.addEventListener("click", () => {
  if (entered) return;
  entered = true;
  document.body.classList.add("entered");
  world.setAttribute("aria-hidden", "false");
  canvas.style.cursor = "grab";
  initAudio();
  loadAllEventCounts();
  setTimeout(() => { const f = markersEl.querySelector(".marker"); if (f) f.setAttribute("tabindex", "0"); }, 900);
});

/* sound toggle — mute state only affects audibility; the visualizer
   above always reacts to the analyser regardless of this setting */
const SOUND_ON_ICON  = `<svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M2 5.5v4h2.4L8 12.5v-10L4.4 5.5H2Z" fill="currentColor"/><path d="M10.3 4.7a5 5 0 0 1 0 5.6M12 3a7.5 7.5 0 0 1 0 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const SOUND_OFF_ICON = `<svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M2 5.5v4h2.4L8 12.5v-10L4.4 5.5H2Z" fill="currentColor"/><path d="M10.5 5.5l3 3M13.5 5.5l-3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const soundBtn = document.getElementById("soundBtn");
soundBtn.innerHTML = SOUND_OFF_ICON;
soundBtn.addEventListener("click", () => {
  initAudio();
  if (!audioCtx) return;
  audioCtx.resume();
  soundOn = !soundOn;
  const now = audioCtx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setTargetAtTime(soundOn ? 0.05 : 0, now, 0.25);
  soundBtn.innerHTML = soundOn ? SOUND_ON_ICON : SOUND_OFF_ICON;
  soundBtn.setAttribute("aria-pressed", String(soundOn));
});

/* clock — Sydney by default, switches to whichever city's sheet is open */
const clockEl = document.getElementById("clock");
const clockZoneEl = document.getElementById("clockZone");
const DEFAULT_CLOCK_TZ = 10, DEFAULT_CLOCK_LABEL = "SYD"; // Sydney
let clockCity = null; // null = show the default (Sydney) time

function tick(){
  const tz = clockCity ? clockCity.tz : DEFAULT_CLOCK_TZ;
  const label = clockCity ? clockCity.zoneLabel : DEFAULT_CLOCK_LABEL;
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  const local = new Date(utcMs + tz * 3600000);
  clockEl.textContent =
    String(local.getUTCHours()).padStart(2, "0") + ":" + String(local.getUTCMinutes()).padStart(2, "0");
  clockZoneEl.textContent = label;
}
tick(); setInterval(tick, 20000);

document.addEventListener("visibilitychange", () => {
  running = !document.hidden;
  last = performance.now();
});

requestAnimationFrame(frame);
})();
